[project]
name = "smartgit"
version = "0.9.0"
description = "Blazing fast GitOps orchestrator for multiple repositories and projects"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Vipul Rathod", email = "vrathod.professional@gmail.com" },
]
keywords = ["git", "cli", "multi-repo", "repository-management", "automation", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "gitpython>=3.1.45",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "typer[all]>=0.26.4",
]

[project.scripts]
smartgit = "smartgit.app.cli.main:main"

[project.urls]
Homepage = "https://github.com/vrathodev/smartgit"
Repository = "https://github.com/vrathodev/smartgit"
Issues = "https://github.com/vrathodev/smartgit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartgit"]
