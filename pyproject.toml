[project]
name = "smartgit"
version = "0.9.0"
description = "SmartGit"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "gitpython>=3.1.45",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "typer[all]>=0.26.4",
]

[project.urls]
Homepage = "https://github.com/vrathodev/smartgit"
Repository = "https://github.com/vrathodev/smartgit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartgit"]
